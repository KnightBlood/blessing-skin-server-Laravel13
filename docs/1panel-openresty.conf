# Blessing Skin Server / 1Panel OpenResty
# Paste into the website's "Rewrite / 伪静态" editor (server context).
# Website document root MUST point to the application's public/ directory.
# Keep the PHP 8.5 FastCGI configuration generated by 1Panel.

# Protect dotfiles, while allowing ACME validation under .well-known/.
if ($uri ~ "(^|/)\.(?!well-known(?:/|$))") {
    return 403;
}

# Match the protection in the upstream public/.htaccess.
if ($uri ~ "^/storage(?:/|$)") {
    return 403;
}

# Serve existing files/directories normally; route other requests to Laravel.
# Original query parameters are preserved automatically by rewrite.
if (!-e $request_filename) {
    rewrite ^ /index.php last;
}
